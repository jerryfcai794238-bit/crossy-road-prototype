<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crossy Road Prototype - 天天過馬路 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">


  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" crossorigin src="/assets/index-X6UkbCks.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BwJH7IEz.css">
</head>
<body>
  <div id="app">
    <!-- 3D Canvas 容器 -->
    <div id="canvas-container"></div>

    <!-- 頂部能量與計時 UI -->
    <div id="energy-bar">
      <div class="energy-pill">
        <span class="energy-icon">⚡</span>
        <span id="energy-count">5/5</span>
        <span id="energy-timer" class="energy-timer-text">已滿</span>
      </div>
    </div>

    <!-- 遊戲 HUD UI -->
    <div id="hud">
      <div class="score-card">
        <span class="score-label">SCORE</span>
        <span id="current-score">0</span>
      </div>
      <div class="high-score-card">
        <span class="score-label">BEST</span>
        <span id="high-score">0</span>
      </div>
    </div>

    <!-- 右上角即時競速排行榜面板 (Live Leaderboard) -->
    <div id="leaderboard">
      <div class="leaderboard-header">🏆 4人同起點競速榜</div>
      <div id="leaderboard-list">
        <!-- 4 位選手動態名次列表 -->
      </div>
    </div>

    <!-- 3 大獨立技能快捷列 (Skill Bar) -->
    <div id="skill-bar">
      <button id="btn-skill-shield" class="skill-btn" data-skill="shield">
        <span class="skill-key">[1]</span>
        <span class="skill-icon">🛡️</span>
        <span class="skill-name">護盾</span>
        <span class="skill-cd-text">READY</span>
        <div class="skill-cd-overlay"></div>
      </button>

      <button id="btn-skill-rocket" class="skill-btn" data-skill="rocket">
        <span class="skill-key">[2]</span>
        <span class="skill-icon">🚀</span>
        <span class="skill-name">火箭</span>
        <span class="skill-cd-text">READY</span>
        <div class="skill-cd-overlay"></div>
      </button>

      <button id="btn-skill-time_slow" class="skill-btn" data-skill="time_slow">
        <span class="skill-key">[3]</span>
        <span class="skill-icon">⏳</span>
        <span class="skill-name">超感</span>
        <span class="skill-cd-text">READY</span>
        <div class="skill-cd-overlay"></div>
      </button>
    </div>

    <!-- 🏛️ 遊戲大廳 / 模式選擇 (Game Lobby) -->
    <div id="start-overlay" class="overlay active">
      <div class="modal-card lobby-card">
        <h1 class="game-title">CROSSY ROAD</h1>
        <p class="game-subtitle">3D 體素過馬路原型大廳</p>

        <!-- 模式選擇卡片區域 -->
        <div class="mode-select-container">
          <!-- 卡片 1: 挑戰模式 -->
          <div class="mode-card challenge-card selected" data-mode="challenge">
            <div class="mode-badge">熱門</div>
            <div class="mode-icon">🏆</div>
            <h3 class="mode-title">挑戰模式</h3>
            <p class="mode-desc">含 7 秒老鷹淘汰與 4 人動物同起點競速榜！挑戰高分極限。</p>
            <div class="mode-cost">消耗 ⚡ 1</div>
          </div>

          <!-- 卡片 2: 休閒模式 -->
          <div class="mode-card casual-card" data-mode="casual">
            <div class="mode-badge casual">推薦</div>
            <div class="mode-icon">🍃</div>
            <h3 class="mode-title">休閒模式</h3>
            <p class="mode-desc">無老鷹發呆淘汰死！輕鬆漫遊過馬路、練習技能與遊玩。</p>
            <div class="mode-cost">消耗 ⚡ 1</div>
          </div>
        </div>

        <div class="instructions">
          <div class="key-hint">
            <span class="key">W</span> 前進，<span class="key">S</span> 後退，<span class="key">A</span> 往左，<span class="key">D</span> 往右
          </div>
          <div class="key-hint">
            <span class="key">1</span> 護盾技能 / <span class="key">2</span> 火箭技能 / <span class="key">3</span> 超感技能
          </div>
        </div>

        <button id="btn-start" class="btn-primary">進入遊戲 (消耗 1 ⚡)</button>
      </div>
    </div>

    <!-- Game Over 彈窗 -->
    <div id="gameover-overlay" class="overlay hidden">
      <div class="modal-card gameover-card">
        <h2 class="gameover-title">GAME OVER</h2>
        <p id="death-reason" class="death-reason">被車撞飛了！</p>
        <div class="final-score-box">
          <div class="score-item">
            <span>最終得分</span>
            <strong id="final-score">0</strong>
          </div>
          <div class="score-item">
            <span>歷史最高</span>
            <strong id="final-best">0</strong>
          </div>
        </div>
        <div class="btn-group">
          <button id="btn-restart" class="btn-primary">再試一次 (消耗 1 ⚡)</button>
          <button id="btn-fast-respawn" class="btn-secondary">空投復活 (3秒)</button>
          <button id="btn-lobby" class="btn-secondary">返回大廳</button>
        </div>
      </div>
    </div>

    <!-- 虛擬 D-Pad 控制器 (Mobile 顯示) -->
    <div id="mobile-controls">
      <button id="btn-up" class="dpad-btn dpad-up">▲</button>
      <div class="dpad-middle">
        <button id="btn-left" class="dpad-btn dpad-left">◄</button>
        <button id="btn-down" class="dpad-btn dpad-down">▼</button>
        <button id="btn-right" class="dpad-btn dpad-right">►</button>
      </div>
    </div>
  </div>

</body>
</html>
