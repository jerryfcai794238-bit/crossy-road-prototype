<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crossy Road Prototype - 天天過馬路 3D</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <!-- 3D Canvas 容器 -->
    <div id="canvas-container"></div>

    <!-- 遊戲 HUD UI -->
    <div id="hud">
      <div class="score-card">
        <span class="score-label">SCORE</span>
        <span id="current-score">0</span>
      </div>
      <div class="high-score-card">
        <span class="score-label">BEST</span>
        <span id="high-score">0</span>
      </div>
    </div>

    <!-- 道具快捷選單與點擊按鈕 -->
    <div id="item-hud">
      <div class="item-selector">
        <button class="item-select-btn active" data-item="shield">[1] 🛡️ 護盾</button>
        <button class="item-select-btn" data-item="rocket">[2] 🚀 火箭</button>
        <button class="item-select-btn" data-item="time_slow">[3] ⏳ 超感</button>
      </div>
      <button id="btn-use-item" class="item-trigger-btn">
        <span id="item-icon">🛡️</span>
        <span id="item-cooldown-text">READY</span>
        <div id="cooldown-overlay"></div>
      </button>
      <div class="item-key-hint">按鍵 [1] [2] [3] 直接切換並使用</div>
    </div>

    <!-- 開始與控制提示 -->
    <div id="start-overlay" class="overlay active">
      <div class="modal-card">
        <h1 class="game-title">CROSSY ROAD</h1>
        <p class="game-subtitle">3D 體素過馬路原型 (道具版)</p>
        <div class="instructions">
          <div class="key-hint">
            <span class="key">W</span> 前進，<span class="key">A</span> 往左，<span class="key">D</span> 往右
          </div>
          <div class="key-hint">
            <span class="key">1</span> 護盾 / <span class="key">2</span> 火箭 / <span class="key">3</span> 超感
          </div>
          <div class="touch-hint">手機可點擊螢幕 / 虛擬 D-Pad 與道具鈕控制</div>
        </div>
        <button id="btn-start" class="btn-primary">開始遊戲</button>
      </div>
    </div>

    <!-- Game Over 彈窗 -->
    <div id="gameover-overlay" class="overlay hidden">
      <div class="modal-card gameover-card">
        <h2 class="gameover-title">GAME OVER</h2>
        <p id="death-reason" class="death-reason">被車撞飛了！</p>
        <div class="final-score-box">
          <div class="score-item">
            <span>最終得分</span>
            <strong id="final-score">0</strong>
          </div>
          <div class="score-item">
            <span>最高紀錄</span>
            <strong id="modal-high-score">0</strong>
          </div>
        </div>
        <div class="gameover-actions">
          <button id="btn-respawn" class="btn-secondary">⚡ 3秒原地復活</button>
          <button id="btn-restart" class="btn-primary">重新開局</button>
        </div>
      </div>
    </div>

    <!-- 行動裝置虛擬方向鍵 -->
    <div id="mobile-controls">
      <button id="btn-up" class="dpad-btn up">▲</button>
      <div class="dpad-middle">
        <button id="btn-left" class="dpad-btn left">◄</button>
        <button id="btn-down" class="dpad-btn down">▼</button>
        <button id="btn-right" class="dpad-btn right">►</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
