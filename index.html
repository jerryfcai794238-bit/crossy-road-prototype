<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Crossy Road Prototype - 《玩星派對》音速過馬路</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">

</head>
<body>
  <div id="app">
    <!-- 3D Canvas 容器 -->
    <div id="canvas-container"></div>

    <!-- 頂部 100 HP 紅色長血條 (Red Health Bar) -->
    <div id="health-bar-container">
      <div class="health-bar-label">HP</div>
      <div class="health-bar-track">
        <div id="health-bar-fill" class="health-bar-fill"></div>
      </div>
      <div id="health-bar-text">100/100</div>
    </div>

    <!-- 🔥 Combo 音速連擊與 PERFECT 打擊浮字特效 -->
    <div id="combo-container" class="combo-hidden">
      <span id="rating-text" class="rating-perfect">PERFECT!!</span>
      <span id="combo-count">🔥 5 COMBO</span>
    </div>

    <!-- 🎮 休閒模式專屬：金幣減速輔助按鈕 -->
    <button id="btn-casual-slowdown" class="casual-slowdown-btn hidden">
      <span class="slowdown-icon">🐌</span>
      <span id="slowdown-text">金幣減速 (可按 3 次)</span>
    </button>

    <!-- 🐌 危險區緩速技能按鈕 -->
    <button id="btn-slow" class="slow-skill-btn">🐌 減速 (3/3)</button>

    <!-- 遊戲 HUD UI -->
    <div id="hud">
      <div class="score-card">
        <span class="score-label">SCORE</span>
        <span id="current-score">0</span>
      </div>
      <div class="high-score-card">
        <span class="score-label">BEST</span>
        <span id="high-score">0</span>
      </div>
    </div>

    <!-- 右上角即時競速排行榜面板 (Live Leaderboard with 👑 Crown) -->
    <div id="leaderboard">
      <div class="leaderboard-header">🏆 4人同起點競速榜</div>
      <div id="leaderboard-list">
        <!-- 4 位選手動態名次列表與 👑 皇冠 -->
      </div>
    </div>

    <!-- 🏛️ 遊戲大廳 / 模式選擇 (Game Lobby) -->
    <div id="start-overlay" class="overlay active">
      <div class="modal-card lobby-card">
        <h1 class="game-title">《玩星派對》</h1>
        <p class="game-subtitle">音速過馬路 (3D 體素大廳)</p>

        <!-- 模式選擇卡片區域 (排序: 休閒模式 > 挑戰模式) -->
        <div class="mode-select-container">
          <!-- 卡片 1: 休閒模式 (第一順位 & 預設 selected) -->
          <div class="mode-card casual-card selected" data-mode="casual">
            <div class="mode-badge casual">推薦</div>
            <div class="mode-icon">🍃</div>
            <h3 class="mode-title">休閒模式</h3>
            <p class="mode-desc">無相機推進、無發呆老鷹死！可隨意停留觀察車道與浮木節奏，無壓力體驗！</p>
            <div class="mode-cost">輕鬆體驗</div>
          </div>

          <!-- 卡片 2: 挑戰模式 (第二順位) -->
          <div class="mode-card challenge-card" data-mode="challenge">
            <div class="mode-badge">熱門</div>
            <div class="mode-icon">🏆</div>
            <h3 class="mode-title">挑戰模式</h3>
            <p class="mode-desc">經典考驗！相機無間斷自主推進與 7.5 秒發呆老鷹抓走淘汰，考驗極速反應！</p>
            <div class="mode-cost">極致考驗</div>
          </div>
        </div>

        <div class="instructions">
          <div class="key-hint">
            <span class="key">W</span> 前進，<span class="key">S</span> 後退，<span class="key">A</span> 往左，<span class="key">D</span> 往右
          </div>
          <div class="touch-hint">手機可點擊螢幕 / 虛擬 D-Pad 與 🐌 減速輔助鈕控制</div>
        </div>

        <button id="btn-start" class="btn-primary">進入遊戲</button>
      </div>
    </div>

    <!-- Game Over 彈窗 -->
    <div id="gameover-overlay" class="overlay hidden">
      <div class="modal-card gameover-card">
        <h2 class="gameover-title">GAME OVER</h2>
        <p id="death-reason" class="death-reason">被車撞飛了！</p>
        <div class="final-score-box">
          <div class="score-item">
            <span>最終得分</span>
            <strong id="final-score">0</strong>
          </div>
          <div class="score-item">
            <span>歷史最高</span>
            <strong id="final-best">0</strong>
          </div>
        </div>
        <div class="btn-group">
          <button id="btn-restart" class="btn-primary">再試一次</button>
          <button id="btn-fast-respawn" class="btn-secondary">空投復活 (3秒)</button>
          <button id="btn-lobby" class="btn-secondary">返回大廳</button>
        </div>
      </div>
    </div>

    <!-- 虛擬 D-Pad 控制器 (Mobile 顯示) -->
    <div id="mobile-controls">
      <button id="btn-up" class="dpad-btn dpad-up">▲</button>
      <div class="dpad-middle">
        <button id="btn-left" class="dpad-btn dpad-left">◄</button>
        <button id="btn-down" class="dpad-btn dpad-down">▼</button>
        <button id="btn-right" class="dpad-btn dpad-right">►</button>
      </div>
    </div>
  </div>

  <script src="./dist/bundle.js"></script>
</body>
</html>
