<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">休閒多人核心循環</title>
  <desc id="desc">觀察、決策、移動或推擠、落地與危險判定、更新局勢依序循環；120 秒倒數全程運作。</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#164a96"/><stop offset="1" stop-color="#4b91e8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="300" rx="26" fill="#f5f9ff"/>
  <rect x="38" y="38" width="1124" height="62" rx="16" fill="url(#g)"/>
  <text x="600" y="78" text-anchor="middle" fill="white" font-family="Arial, Microsoft JhengHei, sans-serif" font-size="24" font-weight="700">120 秒倒數全程運作；歸零時依目前位置結算</text>
  <g font-family="Arial, Microsoft JhengHei, sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(60 148)"><rect width="170" height="94" rx="18" fill="#e9f3ff" stroke="#75a9eb"/><text x="85" y="43" font-size="23" font-weight="700" fill="#174f9e">01 觀察</text><text x="85" y="70" font-size="16" fill="#46617f">車流、河道、隊列</text></g>
    <g transform="translate(285 148)"><rect width="170" height="94" rx="18" fill="#e9f3ff" stroke="#75a9eb"/><text x="85" y="43" font-size="23" font-weight="700" fill="#174f9e">02 決策</text><text x="85" y="70" font-size="16" fill="#46617f">選擇下一格</text></g>
    <g transform="translate(510 148)"><rect width="170" height="94" rx="18" fill="#e9f3ff" stroke="#75a9eb"/><text x="85" y="43" font-size="23" font-weight="700" fill="#174f9e">03 操作</text><text x="85" y="70" font-size="16" fill="#46617f">移動或推擠</text></g>
    <g transform="translate(735 148)"><rect width="170" height="94" rx="18" fill="#fff4df" stroke="#e2ab4a"/><text x="85" y="43" font-size="23" font-weight="700" fill="#9a6100">04 判定</text><text x="85" y="70" font-size="16" fill="#766144">落地、危險、失誤</text></g>
    <g transform="translate(960 148)"><rect width="170" height="94" rx="18" fill="#e8f7f1" stroke="#65ba96"/><text x="85" y="43" font-size="23" font-weight="700" fill="#087c59">05 更新</text><text x="85" y="70" font-size="16" fill="#426c5c">局勢、檢查點、排名</text></g>
  </g>
  <g stroke="#4a7fc6" stroke-width="5" fill="none"><path d="M237 195h35"/><path d="M462 195h35"/><path d="M687 195h35"/><path d="M912 195h35"/></g>
  <g fill="#4a7fc6"><path d="M272 195l-12-8v16z"/><path d="M497 195l-12-8v16z"/><path d="M722 195l-12-8v16z"/><path d="M947 195l-12-8v16z"/></g>
</svg>
