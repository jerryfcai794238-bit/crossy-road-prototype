# Project-scoped team controls.  Do not set a caller model here: each new
# Codex task must remain free to select its own model and reasoning effort.
# Project configuration is loaded only after this repository is trusted.

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
