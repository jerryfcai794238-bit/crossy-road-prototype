# Project-scoped defaults for the Prototype Multi-Model Agent Team.
# Project configuration is loaded only after this repository is trusted.

model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
